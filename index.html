<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>karina0411 • Instagram</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --border: #262626;
      --text: #f5f5f5;
      --subtext: #a8a8a8;
      --blue: #0095f6;
      --like: #ff3040;
      --highlight-ring: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      background: #000;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background: #000;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid #1a1a1a;
      border-right: 1px solid #1a1a1a;
    }
    header.ig-header {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
      background: #000;
    }
    .logo-font {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .verified-badge {
      display: inline-flex;
      color: var(--blue);
      margin-left: 4px;
    }
    .header-icons {
      display: flex;
      gap: 18px;
      align-items: center;
    }
    .svg-btn {
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    main.main-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: 50px;
      position: relative;
    }
    .page-view {
      display: none;
    }
    .page-view.active {
      display: block;
    }
    /* 限時動態列 */
    .story-rail {
      display: flex;
      gap: 14px;
      padding: 12px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }
    .story-rail::-webkit-scrollbar { display: none; }
    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      gap: 5px;
      color: var(--subtext);
    }
    .story-ring {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      padding: 2.5px;
      background: var(--highlight-ring);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #000;
    }
    /* Feed 卡片 */
    .feed-card {
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }
    .feed-media {
      width: 100%;
      max-height: 540px;
      background: #111;
      overflow: hidden;
    }
    .feed-media img, .feed-media video {
      width: 100%;
      display: block;
      object-fit: cover;
    }
    .feed-actions {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px 6px;
    }
    .actions-left {
      display: flex;
      gap: 16px;
    }
    .feed-meta {
      padding: 0 14px 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .feed-meta .likes {
      font-weight: 600;
      margin-bottom: 5px;
    }
    .feed-meta .caption span {
      font-weight: 600;
      margin-right: 6px;
    }
    /* Profile 個人主頁 */
    .profile-header {
      padding: 16px 16px 8px;
    }
    .profile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .profile-avatar-wrap {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .profile-avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .profile-counts {
      display: flex;
      flex: 1;
      justify-content: space-around;
      text-align: center;
    }
    .count-item .num {
      font-weight: 700;
      font-size: 16px;
    }
    .count-item .label {
      font-size: 12px;
      color: var(--subtext);
    }
    .profile-bio {
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .profile-bio .name {
      font-weight: 700;
    }
    .profile-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }
    .btn-ig {
      flex: 1;
      background: #262626;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .profile-tabs {
      display: flex;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .profile-tab {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 10px 0;
      cursor: pointer;
      opacity: 0.4;
    }
    .profile-tab.active {
      opacity: 1;
      border-bottom: 1px solid #fff;
    }
    /* 九宮格 */
    .post-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px;
    }
    .grid-item {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #111;
      overflow: hidden;
      cursor: pointer;
    }
    .grid-item img, .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .pin-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 16px;
      height: 16px;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    /* Reels */
    .reels-container {
      height: calc(100vh - 98px);
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
    }
    .reel-snap {
      position: relative;
      height: 100%;
      scroll-snap-align: start;
      background: #000;
    }
    .reel-snap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .reel-overlay {
      position: absolute;
      right: 12px;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }
    .reel-action {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      gap: 4px;
    }
    .reel-text {
      position: absolute;
      left: 14px;
      bottom: 20px;
      font-size: 13px;
    }
    /* 底部導覽列 */
    nav.bottom-nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 48px;
      background: #000;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }
    .nav-icon {
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    .nav-avatar {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid transparent;
    }
    .nav-avatar.active {
      border-color: #fff;
    }
    /* 彈出視窗 */
    .modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal.active { display: flex; }
    .modal-box {
      width: 100%;
      background: #262626;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-title {
      padding: 12px;
      text-align: center;
      font-weight: 600;
      border-bottom: 1px solid #363636;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

  <script>
    function switchView(viewId) {
      document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(viewId);
      if (target) target.classList.add('active');

      const brand = document.getElementById('header-brand');
      if (viewId === 'view-profile') {
        brand.innerHTML = `<span>karina0411</span><svg class="verified-badge" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;
      } else if (viewId === 'view-messages') {
        brand.innerHTML = '<span>收件匣</span>';
      } else {
        brand.innerHTML = '<span>Instagram</span>';
      }
    }

    function toggleCreateModal(show) {
      document.getElementById('createModal').classList.toggle('active', show);
    }

    function publishPost() {
      const fileInput = document.getElementById('postFileInput');
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const grid = document.getElementById('profileGrid');
          const newItem = document.createElement('div');
          newItem.className = 'grid-item';
          newItem.innerHTML = `<img src="${e.target.result}" />`;
          grid.prepend(newItem);
          toggleCreateModal(false);
          switchView('view-profile');
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        alert('請先選擇要上傳的照片！');
      }
    }
  </script>
</body>
</html>
